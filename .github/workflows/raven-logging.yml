# Generated by Raven logging-doctor.py --install-ci. Runs the same logging
# gates as the Raven pre-commit hook, so `git commit --no-verify` can't skip
# them. The gate scripts are vendored in .github/raven/; refresh them with
# `logging-doctor.py --install-ci --force` after upgrading Raven.
#
# The gates read their baselines from .raven/*-baseline.json, so commit those
# files (or every existing finding blocks the first PR).
name: raven-logging

on:
  pull_request:

permissions:
  contents: read

jobs:
  logging-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stage the decision-map scanner where the gate looks for it
        run: |
          test -f .github/raven/ast_decision_scanner.py || { echo "::error::.github/raven/ast_decision_scanner.py missing - re-run logging-doctor.py --install-ci"; exit 1; }
          mkdir -p "$HOME/.claude/skills/raven-decision-map/scripts"
          cp .github/raven/ast_decision_scanner.py "$HOME/.claude/skills/raven-decision-map/scripts/"
      - name: Decision-map gate
        run: python .github/raven/decision-map-gate.py
      - name: Emitter gate
        run: python .github/raven/raven-emitter-gate.py
      - name: API-log gate
        run: python .github/raven/raven-api-log-gate.py
      - name: Log coverage on changed files
        run: python .github/raven/log-coverage-check.py --pr
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
